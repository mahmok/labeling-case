x-backend-environment: &backend-environment
  DATABASE_DIALECT: postgresql
  DATABASE_HOST: db
  DATABASE_PORT: "5432"
  DATABASE_NAME: labeling
  DATABASE_USER: labeling
  DATABASE_PASS: labeling

x-backend-service: &backend-service
  build:
    context: .
    dockerfile: backend/Dockerfile
  image: labeling-backend:local
  profiles: [full]

services:
  db:
    image: postgres:18-alpine
    container_name: labeling-case-db
    environment:
      POSTGRES_USER: labeling
      POSTGRES_PASSWORD: labeling
      POSTGRES_DB: labeling
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labeling -d labeling"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    <<: *backend-service
    command: ["migrate.ts"]
    environment: *backend-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend-service
    command: ["index.api.ts"]
    environment:
      <<: *backend-environment
      PORT: "3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:3000"

  worker:
    <<: *backend-service
    command: ["index.worker.ts"]
    environment:
      <<: *backend-environment
      JOBS_WORKER_PORT: "3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3001:3001"
